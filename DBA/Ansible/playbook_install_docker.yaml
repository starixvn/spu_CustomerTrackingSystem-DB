- name: Install Docker
  hosts: all
  become: yes
  tasks:
  - name: Import variables
    include_vars: variables_install_docker.yaml

  - name: Get docker version
    command: docker --version
    register: docker_valid
    ignore_errors: yes
  
  - name: Check Docker is already installed 
    fail:
     msg: "will run if docker is installed"
    when: not docker_valid.failed

  - name: Install required system packages for Docker
    apt: name={{ docker_required_packages }} state=latest update_cache=yes
  
  - name: Add Docker GPG key
    apt_key:
      url: "{{ docker_gpg_url }}"
      state: present

  - name: Add repository into sources list
    ansible.builtin.apt_repository:
      repo: "deb [arch={{ ansible_architecture }}] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
      state: present
      filename: docker

  - name: Install Docker
    apt: name={{ docker_packges }} state=latest update_cache=yes

  - name: Start Docker service
    service:
      name: docker
      state: started
      enabled: yes



 
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
    
