version: '3.7'

services:
  neo4j:
    image: neo4j:${NEO4J_TAG}
    hostname: ${NEO4J_HOST}
    container_name: ${NEO4J_HOST}
    restart: always
    ports:
      - "${NEO4J_PORT_WEB}:7474"
      - "${NEO4J_PORT_BOLT}:7687"
    volumes:
      - ${NEO4J_PLUGINS}:/plugins:rw
      - ${NEO4J_DATA}:/data:rw
      - ${NEO4J_LOGS}:/logs:rw
      - ${NEO4J_IMPORT}:/var/lib/neo4j/import:rw
      - ${NEO4J_RUN}:/var/lib/neo4j/run:rw
      #- ${NEO4J_CONF}:/var/lib/neo4j/conf:rw

    environment:
      #neo4j-server
      NEO4J_AUTH: neo4j/admin
      NEO4J_dbms_default__database: cts-datacenter
      NEO4J_dbms_memory_heap_initial__size: ${NEO4J_DBMS_MEMORY_HEAP_INIT}
      NEO4J_dbms_memory_heap.max__size: ${NEO4J_DBMS_MEMORY_HEAP_MAX}
      NEO4J_dbms_memory_pagecache_size: ${NEO4J_DBMS_MEMORY_PAGECACHE}
      NEO4J_dbms_memory_transaction_global__max__size: ${NEO4J_DBMS_MEMORY_TXN_GLOBAL}
      NEO4J_dbms_memory_transaction_database__max__size: ${NEO4J_DBMS_MEMORY_TXN_DB}
      NEO4J_dbms_memory_transaction_max__size: ${NEO4J_DBMS_MEMORY_TXN}
      NEO4J_dbms_logs_debug_level: ${NEO4J_DEBUG_LEVEL}
      #NEO4J_dbms_tx__log_rotation_retention__policy: ${NEO4J_TXN_LOG_ROTATION_SIZE}:
      NEO4J_dbms_windows__service__name: ${NEO4J_HOST}
      TZ: ${NEO4J_TZ}
      
      #kafka-server
      NEO4J_kafka_zookeeper_connect: ${ZOOKEEPER_CONNECT}
      NEO4J_kafka_bootstrap_servers: ${KAFKA_CONNECT}
      NEO4J_kafka_group_id: ${NEO4J_HOST}

      # cyphers-sink
      # Subscriber
      NEO4J_streams_sink_topic_cypher_subscriber: >
        UNWIND event.rows as row
        MERGE(n:Subscriber{SubscriberID: row.after.SubscriberID})
        ON CREATE SET n += row.after
        ON MATCH SET n += row.after
        RETURN n

      #AssociationByDevice
      NEO4J_streams_sink_topic_cypher_associationbydevice: >
        UNWIND event.rows as row
        call apoc.do.case([ event.op = 'c','MERGE (c:CTSCustomer {CTSCustID: event.after.CTSCustID}) MERGE (d:Device {DeviceId: event.after.DCSDeviceID}) MERGE (c)-[r:USED_DEVICE {CTSAssDevID: event.after.CTSAssDevID}]->(d) ON CREATE SET r.SubscriberID = event.after.SubscriberID, r.CreatedTime = event.after.CreatedTime, r.InsertTime = event.after.InsertTime' ,event.op = 'u','MATCH (:CTSCustomer {CTSCustID: event.before.CTSCustID})-[ro:USED_DEVICE]->(:Device {DeviceId: event.before.DCSDeviceID}) DELETE ro MERGE (c:CTSCustomer {CTSCustID: event.after.CTSCustID}) MERGE (d:Device {DeviceId: event.after.DCSDeviceID}) MERGE (c)-[r:USED_DEVICE {CTSAssDevID: event.after.CTSAssDevID}]->(d) ON CREATE SET r.SubscriberID = event.after.SubscriberID, r.CreatedTime = event.after.CreatedTime, r.InsertTime = event.after.InsertTime' ,event.op = 'd','MATCH (c:CTSCustomer {CTSCustID: event.before.CTSCustID})-[r:USED_DEVICE]->(d:Device {DeviceId: event.before.DCSDeviceID}) DELETE r'],'',{event: row}) yield value return value

      #AssociationByManual
      NEO4J_streams_sink_topic_cypher_associationbymanual: >
        UNWIND event.rows as row
        call apoc.do.case([ event.op = 'c','MATCH (c:CTSCustomer {CTSCustID: event.after.FromCTSCustID}) MATCH (c2:CTSCustomer {CTSCustID: event.after.ToCTSCustID}) MERGE (c)-[r:ADD_MANUALLY]->(c2) ON CREATE SET r.Remark = event.after.Remark,r.CreatedDate = event.after.CreatedDate,r.CreatedBy = event.after.CreatedBy RETURN r' ,event.op = 'u','MATCH (CTSCustomer {CTSCustID: event.before.FromCTSCustID})-[oldR:ADD_MANUALLY]->(:CTSCustomer {CTSCustID: event.before.ToCTSCustID}) DELETE oldR WITH event MATCH (c:CTSCustomer {CTSCustID: event.after.FromCTSCustID}) MATCH (c2:CTSCustomer {CTSCustID: event.after.ToCTSCustID}) MERGE (c)-[r:ADD_MANUALLY]->(c2) ON CREATE SET r.Remark = event.after.Remark,r.CreatedDate = event.after.CreatedDate,r.CreatedBy = event.after.CreatedBy RETURN r' ,event.op = 'd','MATCH (:CTSCustomer {CTSCustID: event.before.FromCTSCustID})-[oldR:ADD_MANUALLY]->(:CTSCustomer {CTSCustID: event.before.ToCTSCustID}) DELETE oldR'],'',{event:row}) yield value return value

      #AssociationRemove
      NEO4J_streams_sink_topic_cypher_associationremove: >
        UNWIND event.rows as row
        call apoc.do.case([ event.op = 'c','MATCH (c:CTSCustomer {CTSCustID: event.after.FromCTSCustID}) MATCH (c2:CTSCustomer {CTSCustID: event.after.ToCTSCustID}) MERGE (c)-[r:HAS_EXCEPTION]->(c2) ON CREATE SET r.Remark = event.after.Remark,r.CreatedDate = event.after.CreatedDate,r.CreatedBy = event.after.CreatedBy RETURN r',event.op = 'u','MATCH (:CTSCustomer {CTSCustID: event.before.FromCTSCustID})-[oldR:HAS_EXCEPTION]->(:CTSCustomer {CTSCustID: event.before.ToCTSCustID}) DELETE oldR WITH event MATCH (c:CTSCustomer {CTSCustID: event.after.FromCTSCustID}) MATCH (c2:CTSCustomer {CTSCustID: event.after.ToCTSCustID}) MERGE (c)-[r:HAS_EXCEPTION]->(c2) ON CREATE SET r.Remark = event.after.Remark,r.CreatedDate = event.after.CreatedDate,r.CreatedBy = event.after.CreatedBy RETURN r' ,event.op = 'd','MATCH (:CTSCustomer {CTSCustID: event.before.FromCTSCustID})-[oldR:HAS_EXCEPTION]->(:CTSCustomer {CTSCustID: event.before.ToCTSCustID}) DELETE oldR' ] ,'',{event:row}) yield value return value

      #Evidence
      NEO4J_streams_sink_topic_cypher_evidence: >
        UNWIND event.rows as row
        call apoc.do.case([event.op = 'c','MERGE (n:Evidence { EvidenceID: event.after.EvidenceID }) ON CREATE SET n = event.after RETURN n',event.op = 'u','MATCH (n:Evidence { EvidenceID: event.before.EvidenceID }) SET n = event.after RETURN n',event.op = 'd','MATCH (n:Evidence { EvidenceID: event.before.EvidenceID }) DETACH DELETE n'],'',{event:row}) yield value return value
      
      #CTSCustomer
      NEO4J_streams_sink_topic_cypher_ctscustomer: >
        UNWIND event.rows as row
        call apoc.do.case([ event.op = 'c','MERGE (n:CTSCustomer { CTSCustID: event.after.CTSCustID }) ON CREATE SET n = event.after WITH n, event MERGE (s:Site {SiteID: event.after.SiteID}) ON CREATE SET s.Site = event.after.Site MERGE (n)-[r:BELONG_TO_SITE]->(s) ON CREATE SET r.CreatedDate = datetime() MERGE (st:StaticList {ItemID: event.after.CustStatusID, ListID: 1}) MERGE (n)-[r2:HAS_STATUS]->(st) ON CREATE SET r2.CreatedDate = datetime() RETURN n' ,event.op = 'u','MERGE (n:CTSCustomer {CTSCustID: event.before.CTSCustID }) SET n = event.after WITH n, event OPTIONAL MATCH (n)-[ro:BELONG_TO_SITE]->(s:Site {SiteID: event.before.SiteID}) DELETE ro WITH n,event OPTIONAL MATCH (n)-[r2o:HAS_STATUS]->(st:StaticList {ItemID: event.before.CustStatusID, ListID: 1}) DELETE r2o WITH n,event MERGE (s:Site {SiteID: event.after.SiteID}) MERGE (n)-[rn:BELONG_TO_SITE]->(s) ON CREATE SET rn.CreatedDate = datetime() MERGE (st:StaticList {ItemID: event.after.CustStatusID, ListID: 1}) MERGE (n)-[r2n:HAS_STATUS]->(st) ON CREATE SET r2n.CreatedDate = datetime() RETURN n',event.op = 'd','MATCH (n:CTSCustomer {CTSCustID: event.before.CTSCustID }) DETACH DELETE n'],'',{event:row}) yield value return value
        

      #ctscustomerclassification
      NEO4J_streams_sink_topic_cypher_ctscustomerclassification: >
        UNWIND event.rows as row
        call apoc.do.case([event.op = 'c','MERGE (c:CTSCustomer {CTSCustID: event.after.CTSCustID}) MERGE (ct:CustomerCategory {CategoryID: event.after.CategoryID }) MERGE (c)-[r:HAS_CATEGORY]->(ct) ON CREATE SET r.SportGroupID = event.after.SportGroupID,r.Remark = event.after.Remark, r.CreatedDate = event.after.CreatedDate ,r.CreatedBy = event.after.CreatedBy, r.LastModifiedDate = event.after.LastModifiedDate, r.LastModifiedBy = event.after.LastModifiedBy, r.LastScannedDate = event.after.LastScannedDate RETURN r', event.op = 'u','MATCH (:CTSCustomer {CTSCustID: event.before.CTSCustID})-[oldR:HAS_CATEGORY]->(:CustomerCategory {CategoryID: event.before.CategoryID}) DELETE oldR WITH event MERGE (c:CTSCustomer {CTSCustID: event.after.CTSCustID}) MERGE (ct:CustomerCategory {CategoryID: event.after.CategoryID }) MERGE (c)-[r:HAS_CATEGORY]->(ct) ON CREATE SET r.SportGroupID = event.after.SportGroupID, r.Remark = event.after.Remark, r.CreatedDate = event.after.CreatedDate,  r.CreatedBy = event.after.CreatedBy, r.LastModifiedDate = event.after.LastModifiedDate, r.LastModifiedBy = event.after.LastModifiedBy, r.LastScannedDate = event.after.LastScannedDate RETURN r', event.op = 'd','MATCH (:CTSCustomer {CTSCustID: event.before.CTSCustID})-[oldR:HAS_CATEGORY]->(:CustomerCategory {CategoryID: event.before.CategoryID}) DELETE oldR'],'',{event:row}) yield value return value
        
      #customercategory
      NEO4J_streams_sink_topic_cypher_customercategory: >
        UNWIND event.rows as row
        call apoc.do.case([event.op = 'c','MERGE (n:CustomerCategory { CategoryID: event.after.CategoryID }) ON CREATE SET n = event.after RETURN n',event.op = 'u','MATCH (n:CustomerCategory { CategoryID: event.before.CategoryID }) SET n = event.after RETURN n',event.op = 'd','MATCH (n:CustomerCategory { CategoryID: event.before.CategoryID }) SET n:NeedDelete'],'',{event:row}) yield value return value
        
      #CustomerEvidence
      NEO4J_streams_sink_topic_cypher_custevidence: >
        UNWIND event.rows as row
        call apoc.do.case([event.op = 'c' AND event.after.Level = 0,'MATCH (c:CTSCustomer {CTSCustID: event.after.CTSCustID}) MATCH (e:Evidence {EvidenceID: event.after.EvidenceID}) MERGE (c)-[r:HAS_EVIDENCE]->(e) ON CREATE SET r.Remark = event.after.Remark, r.CreatedDate = event.after.CreatedDate, r.CreatedBy = event.after.CreatedBy', event.op = 'u' AND event.before.Level = 0,'MATCH (c:CTSCustomer {CTSCustID: event.before.CTSCustID})-[r:HAS_EVIDENCE]->(e:Evidence {EvidenceID: event.before.EvidenceID}) SET r.Remark = event.before.Remark, r.CreatedDate = event.before.CreatedDate, r.CreatedBy = event.before.CreatedBy', event.op = 'd' AND event.before.Level = 0,'MATCH (c:CTSCustomer {CTSCustID: event.before.CTSCustID})-[r:HAS_EVIDENCE]->(e:Evidence {EvidenceID: event.before.EvidenceID}) DELETE r'],'',{event:row}) yield value return value
        
      #CustomerCategory
      NEO4J_streams_sink_topic_cypher_staticlist: >
        UNWIND event.rows as row
        call apoc.do.case([event.op = 'c','MERGE (n:StaticList { ListID: event.after.ListID, ItemID: event.after.ItemID }) ON CREATE SET n = event.after RETURN n',event.op = 'u','MATCH (n:StaticList { ListID: event.before.ListID, ItemID: event.before.ItemID }) SET n = event.after RETURN n',event.op = 'd','MATCH (n:StaticList { ListID: event.before.ListID, ItemID: event.before.ItemID }) SET n:NeedDelete'],'',{event:row}) yield value return value

    env_file:
      - neo4j.env
      - kafka.env 

    networks:
      app_network:
        aliases:
          - ${NEO4J_HOST}
      
networks:
  app_network:
    external: ${NETWORK_EXTERNAL}
    name: ${NETWORK_NAME}
    driver: ${NETWORK_DRIVER}
    